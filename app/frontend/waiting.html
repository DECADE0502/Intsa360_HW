<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在启动 Insta360硬件提效平台</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: #1c1c1e;
        background: #f2f2f7;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(460px, calc(100vw - 40px));
        background: #fff;
        border-radius: 16px;
        padding: 34px 30px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 14px 36px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: #007aff;
        color: #fff;
        font-size: 28px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 20px auto;
        border: 3px solid rgba(0, 122, 255, 0.16);
        border-top-color: #007aff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: rgba(60, 60, 67, 0.68);
        line-height: 1.7;
      }
      .hint {
        margin-top: 18px;
        font-size: 13px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">启</div>
      <h1>正在启动 Insta360硬件提效平台</h1>
      <p>首次启动需要几秒钟，服务就绪后会自动打开平台页面。</p>
      <div class="spinner" aria-hidden="true"></div>
      <p class="hint" id="status">正在连接本地服务...</p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const target = params.get("target") || "http://127.0.0.1:8765/";
      const statusEl = document.querySelector("#status");
      let attempts = 0;

      async function check() {
        attempts += 1;
        try {
          const base = new URL(target);
          await fetch(`${base.origin}/api/tools`, { cache: "no-store", mode: "no-cors" });
          location.replace(target);
          return;
        } catch (err) {
          // 服务仍在启动中。
        }
        statusEl.textContent = attempts > 20 ? "仍在等待服务启动，请稍候..." : "正在连接本地服务...";
        setTimeout(check, 700);
      }

      check();
    </script>
  </body>
</html>
