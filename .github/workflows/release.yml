name: Build and publish Insta360_HW

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: write

concurrency:
  group: insta360-hw-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci
        working-directory: frontend

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\publish_release.ps1 -Repo "${{ github.repository }}"
