name: Validate and publish local Insta360_HW release
run-name: Validate release ${{ inputs.tag }} [${{ inputs.validation_id }}]

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag containing the locally built assets
        required: true
        type: string
      revision:
        description: Exact source revision used by the local build
        required: true
        type: string
      validation_id:
        description: Correlation identifier generated by the local publisher
        required: true
        type: string
      release_id:
        description: Numeric identifier of the draft containing the verified assets
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: insta360-hw-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REVISION: ${{ inputs.revision }}
      RELEASE_ID: ${{ inputs.release_id }}
      VALIDATION_ID: ${{ inputs.validation_id }}
    steps:
      - name: Validate dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$VALIDATION_ID" =~ ^[0-9a-f]{32}$ ]]
          test "$RELEASE_REVISION" = "$GITHUB_SHA"

      - name: Check out the exact locally built revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify revision identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          test "v$(tr -d '\r\n' < VERSION)" = "$RELEASE_TAG"

      - name: Install verifier dependencies only
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare verifier
        shell: bash
        run: python -m pip install --disable-pip-version-check cryptography==44.0.2 pydantic==2.11.3

      - name: Assert the draft contains exactly the local artifact set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" > draft.json
          test "$(jq -r '.tag_name' draft.json)" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' draft.json)" = "$RELEASE_REVISION"
          test "$(jq -r '.draft' draft.json)" = "true"
          expected=$(printf '%s\n' \
            "Insta360_HW_Runtime_$(cat VERSION).zip" \
            "Insta360_HW_runtime_v$(cat VERSION).zip" \
            "Insta360_HW_Setup.exe" \
            "SHA256SUMS.txt" \
            "update-manifest-v3.json" \
            "update-manifest.json" | sort)
          actual=$(jq -r '.assets[].name' draft.json | sort)
          test "$actual" = "$expected"

      - name: Download the already built release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" > release.json
          while read -r asset_id asset_name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${GH_REPO}/releases/assets/${asset_id}" > "release-assets/${asset_name}"
          done < <(jq -r '.assets[] | "\(.id) \(.name)"' release.json)

      - name: Verify signatures, hashes, bridge manifest and runtime contents
        shell: bash
        run: >-
          python scripts/release/release_bundle.py verify
          --bundle-dir release-assets
          --public-key config/update_public_key.pem
          --version "$(cat VERSION)"
          --revision "$RELEASE_REVISION"

      - name: Publish the validated draft without rebuilding anything
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
